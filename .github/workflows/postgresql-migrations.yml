name: PostgreSQL migration CI

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "scripts/ci-postgres-migrations.ts"
      - "src/lib/migration-ci-validator.ts"
      - "src/lib/migration-ci-validator.test.ts"
      - ".github/workflows/postgresql-migrations.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: postgresql-migration-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: node ./node_modules/prisma/build/index.js generate

      - name: Run validator tests
        run: node ./node_modules/.bin/vitest run src/lib/migration-ci-validator.test.ts --reporter=dot

      - name: Run disposable base-head migration verification
        run: node ./node_modules/.bin/tsx scripts/ci-postgres-migrations.ts
